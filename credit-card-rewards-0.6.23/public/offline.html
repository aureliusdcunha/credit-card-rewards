<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d141b">
  <title>Offline · Rewards Intelligence</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root{color-scheme:dark;background:#0d141b;color:#e7f0f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:460px;padding:28px;border:1px solid #30414d;border-radius:18px;background:#14212a}
    .mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#64e0bc;color:#0d141b;font-size:27px;font-weight:800}
    h1{font-size:25px;line-height:1.2;margin:22px 0 10px}
    p{color:#a4bac7;line-height:1.65;font-size:14px}
    footer{margin-top:20px;color:#718a98;font-size:10px;letter-spacing:.4px}\n    a{display:inline-block;margin-top:12px;padding:12px 16px;border-radius:10px;background:#64e0bc;color:#10212a;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>You're offline</h1>
    <p>The app shell is ready, but live card data, source review and reward calculations need a connection. Reconnect to load the latest official rules and catalogue.</p>
    <a href="/index.html">Try again</a>
    <footer>Rewards Intelligence · v0.6.23 · build 20261023.21</footer>
  </main>
